version: '3.8'

services:
  # MCP Server - Google Calendar & Gmail
  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_SCOPES=${GOOGLE_SCOPES}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    volumes:
      - ./mcp_server:/app/mcp_server
      - ./.gcp-saved-tokens.json:/app/.gcp-saved-tokens.json
      - ./.env:/app/.env
    networks:
      - unify_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Aggregator Service - Unified Inbox Orchestrator
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.aggregator
    ports:
      - "8001:8001"
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000
      - LLM_SERVICE_URL=http://llm_service:8002
      - MSFT_CLIENT_ID=${MSFT_CLIENT_ID:-}
      - MSFT_CLIENT_SECRET=${MSFT_CLIENT_SECRET:-}
      - MSFT_TENANT_ID=${MSFT_TENANT_ID:-}
    volumes:
      - ./aggregator:/app/aggregator
      - ./.env:/app/.env
    depends_on:
      - mcp_server
      - llm_service
    networks:
      - unify_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM Service - Summarization & Action Extraction
  llm_service:
    build:
      context: .
      dockerfile: Dockerfile.llm
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./llm_service:/app/llm_service
      - ./.env:/app/.env
    depends_on:
      - qdrant
      - redis
    networks:
      - unify_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant - Vector Database for Semantic Search
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - unify_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Cache and Conversation Memory
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - unify_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - React UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_AGGREGATOR_URL=http://aggregator:8001
      - VITE_LLM_SERVICE_URL=http://llm_service:8002
      - VITE_ENABLE_AI_FEATURES=true
    depends_on:
      - aggregator
      - llm_service
    networks:
      - unify_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  unify_network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
